@if (livre(); as l) {
<div class="livre">
    <div class="couv">
        {{ l.titre }}
    </div>
    <div class="infos">
        <h1>{{ l.titre }}</h1>
        <p class="auteur">par {{ l.auteur }}</p>
        <p class="prix">{{ l.prix }} €</p>
        <button [disabled]="ajoute()" (click)="ajouter()">
            {{ ajoute() ? 'Ajouté' : 'Ajouter au panier' }}
        </button>
    </div>
</div>
} @else {
<p class="not-found">Ce livre n'existe pas.</p>
}
<h2>Vous aimerez aussi</h2>
<div class="suggestions">
    @for (s of suggestions(); track s.id) {
    <app-livre [livre]="s"></app-livre>
    }
</div>
